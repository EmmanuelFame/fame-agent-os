[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fame-agent-os"
version = "1.2.0"
description = "Portable, token-efficient orchestration above Codex"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Fame Agent OS"}]

[project.scripts]
fame = "fame_agent_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
